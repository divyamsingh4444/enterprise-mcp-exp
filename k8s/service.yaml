apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  namespace: mcp-system
  labels:
    app: enterprise-mcp
spec:
  type: ClusterIP
  selector:
    app: enterprise-mcp
    component: server
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-loadbalancer
  namespace: mcp-system
  labels:
    app: enterprise-mcp
spec:
  type: LoadBalancer
  selector:
    app: enterprise-mcp
    component: server
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  loadBalancerSourceRanges:
  - 0.0.0.0/0
