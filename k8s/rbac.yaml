apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-sa
  namespace: mcp-system
  labels:
    app: enterprise-mcp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-role
  namespace: mcp-system
  labels:
    app: enterprise-mcp
rules:
# Allow reading config maps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# Allow reading secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
# Allow reading pods (for service discovery)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Allow reading services
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
# Allow reading endpoints
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-rolebinding
  namespace: mcp-system
  labels:
    app: enterprise-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-role
subjects:
- kind: ServiceAccount
  name: mcp-sa
  namespace: mcp-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-cluster-rolebinding
  labels:
    app: enterprise-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-cluster-role
subjects:
- kind: ServiceAccount
  name: mcp-sa
  namespace: mcp-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-cluster-role
  labels:
    app: enterprise-mcp
rules:
# Allow reading cluster-wide config
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Allow reading cluster-wide metrics
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
